services:
  tricount-web:
    build: ..
    container_name: tricount-web
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    environment:
      - FLASK_DEBUG=1
