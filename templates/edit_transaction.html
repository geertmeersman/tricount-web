{% extends "base.html" %}
{% block title %}Transactie aanpassen{% endblock %}
{% block content %}
<div class="flex items-center justify-between mb-4">
  <h1 class="text-xl font-bold">Transactie aanpassen</h1>
  <a href="{{ url_for('tricount_detail', token=token) }}" class="text-sm text-blue-600 hover:underline">← Terug</a>
</div>

<div class="bg-white rounded-xl shadow p-4">
  <form method="POST" class="space-y-4">
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Omschrijving</label>
      <input type="text" name="description" value="{{ tx.description }}" required autofocus
        class="w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400">
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Bedrag ({{ t.currency }})</label>
      <input type="number" name="amount" step="0.01" min="0.01" value="{{ tx.amount.value | float | abs }}" required
        class="w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400">
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Betaald door</label>
      <select name="payer" required
        class="w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400">
        {% for m in t.members %}
        <option value="{{ m.uuid }}" {{ 'selected' if m.uuid == tx.membership_uuid_owner }}>{{ m.display_name }}</option>
        {% endfor %}
      </select>
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-2">Verdelen onder</label>
      <div class="space-y-1">
        {% for m in t.members %}
        <label class="flex items-center gap-2 text-sm">
          <input type="checkbox" name="split_among" value="{{ m.uuid }}"
            {{ 'checked' if m.uuid in current_split_uuids }}
            class="rounded border-gray-300 text-blue-600">
          {{ m.display_name }}
        </label>
        {% endfor %}
      </div>
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Datum</label>
      <input type="date" name="date" value="{{ tx.date[:10] }}"
        class="w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400">
    </div>
    <button class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-lg text-sm font-medium">Opslaan</button>
  </form>
</div>
{% endblock %}
