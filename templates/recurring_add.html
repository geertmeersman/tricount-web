{% extends "base.html" %}
{% block title %}🔁 Nieuwe herhalende expense{% endblock %}
{% block content %}
<div class="flex items-center justify-between mb-4">
  <h1 class="text-xl font-bold">🔁 Nieuwe herhalende expense</h1>
  <a href="{{ url_for('recurring_list', token=token) }}" class="text-sm text-blue-600 hover:underline">← Terug</a>
</div>

<div class="bg-white rounded-xl shadow p-4">
  <form method="POST" class="space-y-4">
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Omschrijving</label>
      <input type="text" name="description" required autofocus
        class="w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400">
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Bedrag</label>
      <input type="number" name="amount" step="0.01" min="0.01" required
        class="w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400">
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Betaald door</label>
      <select name="payer" required
        class="w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400">
        {% for m in t.members %}
        <option value="{{ m.uuid }}">{{ m.display_name }}</option>
        {% endfor %}
      </select>
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-2">Verdelen onder</label>
      <div class="space-y-1">
        {% for m in t.members %}
        <label class="flex items-center gap-2 text-sm">
          <input type="checkbox" name="split_among" value="{{ m.uuid }}" checked
            class="rounded border-gray-300 text-blue-600">
          {{ m.display_name }}
        </label>
        {% endfor %}
      </div>
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Frequentie</label>
      <select name="frequency" required
        class="w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400">
        {% for f in frequencies %}
        <option value="{{ f }}">{{ frequency_labels[f] }}</option>
        {% endfor %}
      </select>
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Eerste uitvoering</label>
      <input type="date" name="start_date" value="{{ today }}" required
        class="w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400">
      <p class="text-xs text-gray-400 mt-1">Kies vandaag of een datum in het verleden → wordt meteen toegevoegd.</p>
    </div>
    <button class="w-full bg-green-600 hover:bg-green-700 text-white py-2 rounded-lg text-sm font-medium">Aanmaken</button>
  </form>
</div>
{% endblock %}
