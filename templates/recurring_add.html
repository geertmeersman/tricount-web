{% extends "base.html" %}
{% block title %}{{ _("Recurring expenses") }}{% endblock %}
{% block content %}
<div class="flex items-center justify-between mb-4">
  <h1 class="text-xl font-bold">{{ _("Recurring expenses") }}</h1>
  <a href="{{ url_for('recurring_list', token=token) }}"
    class="w-10 h-10 flex items-center justify-center rounded-xl bg-white shadow hover:shadow-md text-gray-500 hover:text-blue-600 transition">
    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
  </a>
</div>

<div class="bg-white rounded-xl shadow p-4">
  <form method="POST" class="space-y-4">
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">{{ _("Description") }}</label>
      <input type="text" name="description" required autofocus
        class="w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400">
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">{{ _("Amount") }}</label>
      <input type="number" name="amount" step="0.01" min="0.01" required
        class="w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400">
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">{{ _("Paid by label") }}</label>
      <select name="payer" required
        class="w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400">
        {% for m in t.members %}
        <option value="{{ m.uuid }}">{{ m.display_name }}</option>
        {% endfor %}
      </select>
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-2">{{ _("Split among") }}</label>
      <div class="space-y-1">
        {% for m in t.members %}
        <label class="flex items-center gap-2 text-sm">
          <input type="checkbox" name="split_among" value="{{ m.uuid }}" checked
            class="rounded border-gray-300 text-blue-600">
          {{ m.display_name }}
        </label>
        {% endfor %}
      </div>
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">{{ _("Frequency") }}</label>
      <select name="frequency" required
        class="w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400">
        {% for f in frequencies %}
        <option value="{{ f }}">{{ _(f) }}</option>
        {% endfor %}
      </select>
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">{{ _("Start date") }}</label>
      <input type="date" name="start_date" id="startDateInput" value="{{ today }}" required
        class="w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400">
      <p class="text-xs text-gray-400 mt-1">{{ _("Start date hint") }}</p>
      <div id="backfillWarning" class="hidden mt-2 p-2 bg-amber-50 border border-amber-200 rounded-lg text-xs text-amber-700"></div>
    </div>
    <button class="w-full bg-green-600 hover:bg-green-700 text-white py-2 rounded-lg text-sm font-medium">{{ _("Save recurring") }}</button>
  </form>
</div>
<script nonce="{{ csp_nonce }}">
const _today = {{ today | tojson }};
const _frequencies = {
  daily:   {{ _("daily") | tojson }},
  weekly:  {{ _("weekly") | tojson }},
  monthly: {{ _("monthly") | tojson }},
  yearly:  {{ _("yearly") | tojson }},
};
const _backfillMsg = {{ _("Backfill warning") | tojson }};

function countBackfill(startStr, frequency) {
  const start = new Date(startStr);
  const today = new Date(_today);
  if (start >= today) return 0;
  let count = 0, cur = new Date(start);
  while (cur <= today) {
    count++;
    if (frequency === 'daily')        cur.setDate(cur.getDate() + 1);
    else if (frequency === 'weekly')  cur.setDate(cur.getDate() + 7);
    else if (frequency === 'monthly') cur.setMonth(cur.getMonth() + 1);
    else if (frequency === 'yearly')  cur.setFullYear(cur.getFullYear() + 1);
    else break;
  }
  return count;
}

function updateBackfillWarning() {
  const start = document.getElementById('startDateInput').value;
  const freq = document.querySelector('[name=frequency]').value;
  const n = countBackfill(start, freq);
  const el = document.getElementById('backfillWarning');
  if (n > 0) {
    el.textContent = _backfillMsg.replace('{n}', n).replace('{freq}', _frequencies[freq] || freq);
    el.classList.remove('hidden');
  } else {
    el.classList.add('hidden');
  }
}

document.getElementById('startDateInput').addEventListener('change', updateBackfillWarning);
document.querySelector('[name=frequency]').addEventListener('change', updateBackfillWarning);
updateBackfillWarning();
</script>
{% endblock %}
