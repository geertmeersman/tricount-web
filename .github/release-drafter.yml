name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
version-resolver:
  major:
    when:
      - label: breaking
  minor:
    when:
      - label: enhancement
      - label: feat
  patch:
    when:
      - label: bug
      - label: fix
      - label: dependencies
      - label: chore
      - label: ci
      - label: docs
  default: patch
categories:
  - title: '🚀 New features'
    when:
      - label: enhancement
      - label: feat
  - title: '🐛 Bug fixes'
    when:
      - label: bug
      - label: fix
  - title: '🔒 Security'
    when:
      - label: security
  - title: '📦 Dependencies'
    when:
      - label: dependencies
  - title: '🔧 Maintenance'
    when:
      - label: chore
      - label: ci
      - label: refactor
  - title: '📖 Documentation'
    when:
      - label: docs
      - label: documentation
exclude-labels: [skip-changelog]
change-template: '- $TITLE (#$NUMBER) @$AUTHOR'
template: |
  ## What's changed

  $CHANGES

  ---
  🙏 Thanks to $CONTRIBUTORS for contributing to this release!
exclude-contributors:
  - geertmeersman[bot]
  - dependabot[bot]
  - github-actions[bot]
