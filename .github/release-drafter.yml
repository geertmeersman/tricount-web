name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
version-resolver:
  major:
    labels: [breaking]
  minor:
    labels: [enhancement, feat]
  patch:
    labels: [bug, fix, dependencies, chore, ci, docs]
  default: patch
categories:
  - title: '🚀 New features'
    labels: [enhancement, feat]
  - title: '🐛 Bug fixes'
    labels: [bug, fix]
  - title: '🔒 Security'
    labels: [security]
  - title: '📦 Dependencies'
    labels: [dependencies]
  - title: '🔧 Maintenance'
    labels: [chore, ci, refactor]
  - title: '📖 Documentation'
    labels: [docs, documentation]
exclude-labels: [skip-changelog]
change-template: '- $TITLE (#$NUMBER) @$AUTHOR'
template: |
  ## What's changed

  $CHANGES

  ---
  🙏 Thanks to $CONTRIBUTORS for contributing to this release!
exclude-contributors:
  - geertmeersman[bot]
  - dependabot[bot]
  - github-actions[bot]
