name: Release on base image merge 🚀

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  trigger-release:
    permissions:
      contents: write
      pull-requests: write
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'fix/pin-python-')
    uses: ./.github/workflows/release.yml
    secrets: inherit
