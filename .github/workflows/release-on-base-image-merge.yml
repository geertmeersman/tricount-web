name: Release on base image merge 🚀

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  trigger-release:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'fix/pin-python-')
    runs-on: ubuntu-latest
    permissions:
      actions: write

    steps:
      - name: Trigger release workflow
        run: |
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -d '{"ref":"main"}' \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/release.yml/dispatches"
