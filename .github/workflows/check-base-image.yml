name: Check base image 🐳

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Get upstream digest and version
        id: upstream
        run: |
          DIGEST=$(curl -s "https://hub.docker.com/v2/repositories/library/python/tags/3.13-slim" | jq -r '.digest')
          VERSION=$(curl -s "https://hub.docker.com/v2/repositories/library/python/tags/?name=3.13." \
            | jq -r '.results[] | select(.name | test("^3\\.13\\.[0-9]+-slim$")) | .name' \
            | sort -V | tail -1)
          echo "digest=${DIGEST}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Get stored digest from Dockerfile
        id: stored
        run: |
          STORED=$(grep "^FROM python:3.13-slim@" Dockerfile | grep -oP 'sha256:[a-f0-9]+' || echo "")
          echo "digest=${STORED}" >> $GITHUB_OUTPUT

      - name: Compare digests
        id: compare
        run: |
          if [[ "${{ steps.upstream.outputs.digest }}" != "${{ steps.stored.outputs.digest }}" ]]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Update FROM in Dockerfile and docs
        if: steps.compare.outputs.changed == 'true'
        run: |
          sed -i "s|^# python:3.13-slim .*|# python:3.13-slim ${{ steps.upstream.outputs.version }}|" Dockerfile
          sed -i "s|^FROM python:3.13-slim.*|FROM python:3.13-slim@${{ steps.upstream.outputs.digest }}|" Dockerfile
          sed -i "s|currently pinned to \`.*\`|currently pinned to \`${{ steps.upstream.outputs.version }}\`|g" README.md DOCKER_HUB.md

      - name: Create PR with updated files
        if: steps.compare.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="fix/pin-python-3.13-slim-${{ steps.upstream.outputs.version }}"
          git checkout -b "${BRANCH}"
          git add Dockerfile README.md DOCKER_HUB.md
          git diff --cached --quiet && echo "Nothing to commit" && exit 0
          git commit -m "fix: pin python:3.13-slim to ${{ steps.upstream.outputs.version }} (${{ steps.upstream.outputs.digest }})"
          git push origin "${BRANCH}"
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pulls" \
            -d "{
              \"title\": \"fix: pin python:3.13-slim to ${{ steps.upstream.outputs.version }}\",
              \"body\": \"Automated base image update.\n\n- New digest: \`${{ steps.upstream.outputs.digest }}\`\n- New version: \`${{ steps.upstream.outputs.version }}\`\",
              \"head\": \"${BRANCH}\",
              \"base\": \"main\"
            }"
