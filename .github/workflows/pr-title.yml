name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  semantic-title:
    name: Check PR title
    runs-on: ubuntu-latest
    steps:
      - name: Validate Conventional Commits title
        uses: amannn/action-semantic-pull-request@v5.5.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            test
            chore
            ci
          requireScope: false
